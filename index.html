<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deegitaliz - Belajar Digital</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f4f6fb;color:#222}
header{background:#6a11cb;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
.btn-primary{background:#6a11cb;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-gray{background:#e5e7eb}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.wrap{max-width:1000px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}
.badge{background:#ede9fe;color:#6a11cb;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.hidden{display:none!important}
.flex{display:flex;gap:8px;flex-wrap:wrap}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
</style>
</head>
<body>
<header><b>🚀 Deegitaliz</b><span id="userInfo"></span></header>

<div class="wrap" id="pageLogin">
  <div class="card" style="max-width:420px;margin:40px auto;text-align:center">
    <h2>Selamat Datang 👋</h2><p>Login untuk belajar</p>
    <input id="loginUser" placeholder="Username - coba: admin / user">
    <input id="loginPass" type="password" placeholder="Password - admin: admin123 / user: 123456">
    <button class="btn-primary" style="width:100%" onclick="doLogin()">Masuk</button>
    <p style="font-size:13px;color:#666">Belum punya akun? <a href="#" onclick="doRegister();return false">Daftar</a></p>
    <p id="loginMsg" style="color:red"></p>
  </div>
</div>

<div class="wrap hidden" id="pageHome">
  <div class="topbar">
    <div><h2 style="margin:0">Modul Belajar</h2><span id="modulCount" class="badge">0 Modul</span> <span id="modeLabel" class="badge">Mode Edit: OFF</span></div>
    <div class="flex">
      <button class="btn-gray" onclick="toggleAdmin()">Mode Edit</button>
      <button class="btn-green" onclick="tambahModul()">+ Tambah Modul</button>
      <button class="btn-gray" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="card hidden" id="panelAdmin" style="margin-bottom:16px">
    <h3>🛠️ Panel Admin</h3>
    <p id="adminInfo">Kelola user & modul di sini.</p>
    <div id="userList"></div>
  </div>

  <input id="searchModul" placeholder="🔍 Cari modul..." oninput="renderModulList()">
  <div id="modulList" class="grid" style="margin-top:16px"></div>
  <p id="emptyMsg" class="hidden" style="text-align:center;color:#888">Belum ada modul. Klik + Tambah Modul.</p>
</div>

<script>
let DB = JSON.parse(localStorage.getItem('deegitalizDB') || 'null');
if(!DB){
  DB = {
    users:[{username:'admin',password:'admin123',role:'admin',status:'disetujui'},{username:'user',password:'123456',role:'user',status:'disetujui'}],
    modul:[
      {id:1,judul:'Dasar Komputer',desc:'Pengenalan komputer & internet',kelas:[{judul:'Apa itu Komputer?'}]},
      {id:2,judul:'Microsoft Word',desc:'Mengetik & format dokumen',kelas:[{judul:'Membuat Dokumen Baru'}]},
      {id:3,judul:'Microsoft Excel',desc:'Rumus & tabel',kelas:[{judul:'Rumus Dasar'}]},
      {id:4,judul:'Canva & Desain',desc:'Desain poster & presentasi',kelas:[{judul:'Desain Poster'}]},
      {id:5,judul:'Keamanan Digital',desc:'Password & penipuan online',kelas:[{judul:'Password Aman'}]},
      {id:6,judul:'AI & Masa Depan',desc:'Mengenal AI untuk belajar',kelas:[{judul:'Apa itu AI?'}]}
    ]
  };
}
let currentUser = null;
let isEditMode = false;
function saveDB(){ localStorage.setItem('deegitalizDB', JSON.stringify(DB)); }

function doLogin(){
  let u=document.getElementById('loginUser').value.trim();
  let p=document.getElementById('loginPass').value.trim();
  let found=DB.users.find(x=>x.username===u && x.password===p);
  if(!found){ document.getElementById('loginMsg').innerText='Username / password salah!'; return; }
  if(found.status!=='disetujui'){ document.getElementById('loginMsg').innerText='Akun belum disetujui admin!'; return; }
  currentUser=found;
  document.getElementById('pageLogin').classList.add('hidden');
  document.getElementById('pageHome').classList.remove('hidden');
  document.getElementById('userInfo').innerText='Halo, '+found.username+' ('+found.role+')';
  renderModulList(); renderUsers();
}
function doRegister(){
  let u=prompt('Username baru:'); if(!u) return;
  let p=prompt('Password baru:'); if(!p) return;
  if(DB.users.find(x=>x.username===u)){ alert('Username sudah ada!'); return; }
  DB.users.push({username:u,password:p,role:'user',status:'menunggu'});
  saveDB(); alert('Pendaftaran berhasil! Tunggu disetujui admin.');
}
function doLogout(){ location.reload(); }

function toggleAdmin(){
  isEditMode=!isEditMode;
  document.getElementById('modeLabel').innerText='Mode Edit: '+(isEditMode?'ON':'OFF');
  document.getElementById('panelAdmin').classList.toggle('hidden', !isEditMode);
  renderModulList();
}
function renderUsers(){
  let el=document.getElementById('userList');
  el.innerHTML=DB.users.map((u,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span><b>${u.username}</b> - ${u.role} - ${u.status}</span><span><button class="btn-green" onclick="setujuiUser(${i})">Setujui</button> <button class="btn-red" onclick="hapusUser(${i})">Hapus</button></span></div>`).join('');
}
function setujuiUser(i){ DB.users[i].status='disetujui'; saveDB(); renderUsers(); alert('User disetujui!'); }
function tolakUser(i){ DB.users[i].status='ditolak'; saveDB(); renderUsers(); }
function hapusUser(i){ if(!confirm('Hapus user ini?')) return; DB.users.splice(i,1); saveDB(); renderUsers(); }

function renderModulList(){
  let q=(document.getElementById('searchModul').value||'').toLowerCase();
  let list=DB.modul.filter(m=>(m.judul||'').toLowerCase().includes(q));
  document.getElementById('modulCount').innerText=list.length+' Modul • '+DB.modul.reduce((a,m)=>a+(m.kelas?m.kelas.length:0),0)+' Kelas';
  document.getElementById('emptyMsg').classList.toggle('hidden', list.length>0);
  document.getElementById('modulList').innerHTML=list.map(m=>{
    let idx=DB.modul.indexOf(m);
    return `<div class="card"><span class="badge">${m.kelas?m.kelas.length:0} Kelas</span><h3>${m.judul}</h3><p style="color:#666">${m.desc||''}</p><div class="flex"><button class="btn-primary" onclick="bukaModul(${idx})">Buka</button>${isEditMode?`<button class="btn-gray" onclick="editModul(${idx})">Edit</button><button class="btn-red" onclick="hapusModul(${idx})">Hapus</button>`:''}</div></div>`;
  }).join('');
}
function tambahModul(){
  let j=prompt('Judul Modul baru:'); if(!j) return;
  let d=prompt('Deskripsi modul:')||'Modul baru';
  DB.modul.push({id:Date.now(),judul:j,desc:d,kelas:[]});
  saveDB(); renderModulList(); alert('Modul berhasil ditambah!');
}
function editModul(i){
  let j=prompt('Edit judul modul:',DB.modul[i].judul); if(j===null) return;
  let d=prompt('Edit deskripsi:',DB.modul[i].desc||''); if(d===null) return;
  DB.modul[i].judul=j; DB.modul[i].desc=d;
  saveDB(); renderModulList(); alert('Modul berhasil diedit!');
}
function hapusModul(i){
  if(!confirm('Hapus modul "'+DB.modul[i].judul+'"?')) return;
  DB.modul.splice(i,1); saveDB(); renderModulList();
}
function bukaModul(i){
  let m=DB.modul[i];
  let kelas=(m.kelas||[]).map(k=>'- '+k.judul).join('\n')||'(Belum ada kelas)';
  let aksi='';
  if(isEditMode){ aksi='\n\nKetik OK untuk tambah kelas?'; }
  alert(m.judul+'\n'+(m.desc||'')+'\n\nKelas:\n'+kelas);
  if(isEditMode){
    let nk=prompt('Tambah kelas baru ke modul ini (kosongkan untuk batal):');
    if(nk){ m.kelas.push({judul:nk}); saveDB(); renderModulList(); alert('Kelas ditambah!'); }
  }
}
</script>
</body>
</html>
